name: static-repo-gates

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  static-repo-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static repository gates
        run: python tools/repo_quality_gates/run_static_repo_gates.py
